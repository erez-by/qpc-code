[project]
name = "qpc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "matplotlib", "mpmath"]

[project.optional-dependencies]
transport = ["kwant"]          # 2D transmission (qpc/transport.py); built from source, see OPEN_QUESTIONS #15

[tool.setuptools]
packages = ["qpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
